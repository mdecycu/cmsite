
# ============================================================
# rust.properties
# Rust language settings for SciTE on Windows
#
# Environment:
#   Windows
#   Portable Rust / rustup
#   rustc + Cargo
#
# Cargo project example:
#   R:\projects\guessing
#   R:\projects\guessing\Cargo.toml
#   R:\projects\guessing\src\main.rs
#
# rand version example:
#   rand = "0.10.3"
#
# IMPORTANT:
#   Third-party crates must be built with Cargo.
#   Do not use rustc directly for Cargo projects.
# ============================================================


# ============================================================
# 1. File patterns and language registration
# ============================================================

file.patterns.rust=*.rs
filter.rust=Rust (rs)|$(file.patterns.rust)|
*filter.rust=$(filter.rust)
lexer.$(file.patterns.rust)=rust
*language.rust=Rust|rs||


# ============================================================
# 2. Word characters
# ============================================================

word.chars.rust=$(chars.alpha)$(chars.numeric)_#
word.characters.$(file.patterns.rust)=$(word.chars.rust)
calltip.rust.word.characters=$(chars.alpha)$(chars.numeric)_


# ============================================================
# 3. Comments
# ============================================================

comment.block.at.line.start.rust=1
comment.block.rust=//
comment.stream.start.rust=/*
comment.stream.end.rust=*/
comment.box.start.rust=/*
comment.box.middle.rust= *
comment.box.end.rust= */


# ============================================================
# 4. Indentation and braces
# ============================================================

statement.indent.$(file.patterns.rust)=6
statement.end.$(file.patterns.rust)=16 ;
statement.lookback.$(file.patterns.rust)=20
block.start.$(file.patterns.rust)=16 {
block.end.$(file.patterns.rust)=16 }
braces.rust.style=16


# ============================================================
# 5. Rust keywords
#
# Keep this list aligned with the Rust lexer version.
# Some contextual/reserved words are included for highlighting.
# ============================================================

keywords.$(file.patterns.rust)=
alignof as async await become box break const continue crate
do dyn else enum extern false final fn for gen if impl in
let loop macro match mod move mut override priv pub raw ref
return safe self Self sizeof static struct super trait true
try type typeof unsafe unsized use virtual where while yield


# ============================================================
# 6. Common Rust built-in types
# ============================================================

keywords2.$(file.patterns.rust)=
bool char f32 f64 i8 i16 i32 i64 i128 isize
str u8 u16 u32 u64 u128 usize


# ============================================================
# 7. Additional language identifiers
# ============================================================

keywords3.$(file.patterns.rust)=Self


# ============================================================
# 8. Optional code folding
# ============================================================

# Enable these only if supported by your SciTE/Rust lexer build.
#fold.rust.comment.explicit=0
#fold.rust.comment.multiline=0
#fold.rust.explicit.anywhere=1
#fold.rust.explicit.end=//[[
#fold.rust.explicit.start=//]]
#fold.rust.syntax.based=1


# ============================================================
# 9. Rust lexer styles
# ============================================================

# Default
style.rust.32=$(font.base)

# Whitespace
style.rust.0=fore:#808080

# Block comment
style.rust.1=$(colour.code.comment.box),$(font.code.comment.box)

# Line comment
style.rust.2=$(colour.code.comment.line),$(font.code.comment.line)

# Block documentation comment
style.rust.3=$(colour.code.comment.doc),$(font.code.comment.doc)

# Line documentation comment
style.rust.4=$(colour.code.comment.doc),$(font.code.comment.doc)

# Number
style.rust.5=$(colour.number)

# Keywords
style.rust.6=$(colour.keyword),bold
style.rust.7=$(colour.keyword),bold
style.rust.8=$(colour.keyword)
style.rust.9=$(colour.keyword),bold
style.rust.10=$(colour.keyword),bold
style.rust.11=$(colour.keyword),bold
style.rust.12=$(colour.keyword),bold

# Regular string
style.rust.13=$(colour.string)

# Raw string
style.rust.14=fore:#B090B0

# Character
style.rust.15=$(colour.char)

# Operator
style.rust.16=$(colour.operator),bold

# Identifier
style.rust.17=

# Lifetime
style.rust.18=fore:#007F7F

# Macro
style.rust.19=$(colour.preproc)

# Lexical error
style.rust.20=fore:#000000,$(font.monospace),back:#E0C0E0

# Byte string
style.rust.21=$(colour.string)

# Raw byte string
style.rust.22=fore:#B090B0

# Byte character
style.rust.23=$(colour.char)

# C string
style.rust.24=fore:#A000C0

# Raw C string
style.rust.25=fore:#A070C0


# ============================================================
# 10. Single-file rustc commands
#
# Use only for standalone .rs files without external crates.
# Output executable: <filename>.exe
# ============================================================

command.compile.*.rs=rustc "$(FileNameExt)" -o "$(FileName).exe"
command.go.*.rs="$(FileName).exe"


# ============================================================
# 11. Cargo commands
#
# These commands require the current working directory to contain
# Cargo.toml. See the notes below for project-directory handling.
# ============================================================

# Cargo Init：在目前目錄建立 Cargo 專案
command.name.1.*.rs=Cargo Init
command.1.*.rs=cargo init

# Cargo Build：編譯專案
command.name.2.*.rs=Cargo Build
command.2.*.rs=cargo build

# Cargo Run：編譯並執行
command.name.3.*.rs=Cargo Run
command.3.*.rs=cargo run

# Cargo Check：快速檢查程式
command.name.4.*.rs=Cargo Check
command.4.*.rs=cargo check

# Cargo Test：執行測試
command.name.5.*.rs=Cargo Test
command.5.*.rs=cargo test

# Cargo Clean：清除建置產物
command.name.6.*.rs=Cargo Clean
command.6.*.rs=cargo clean

# Cargo Build Release：最佳化編譯
command.name.7.*.rs=Cargo Build Release
command.7.*.rs=cargo build --release

# Cargo Run Release：以 Release 模式執行
command.name.8.*.rs=Cargo Run Release
command.8.*.rs=cargo run --release

# Cargo Fmt：格式化程式碼
command.name.9.*.rs=Cargo Fmt
command.9.*.rs=cargo fmt

# Cargo Clippy：進階程式碼檢查
command.name.10.*.rs=Cargo Clippy
command.10.*.rs=cargo clippy


# ============================================================
# 12. Command output subsystem
# ============================================================

command.compile.subsystem.*.rs=0
command.go.subsystem.*.rs=0

# Keep output visible in SciTE.
# Cargo custom commands use the default external command subsystem
# unless overridden by the SciTE version/configuration.


# ============================================================
# 13. Error message patterns
#
# Rust diagnostics commonly contain:
#   --> src\main.rs:8:25
#
# Exact error navigation support depends on the SciTE version,
# errorlist implementation, and output format.
# ============================================================

errorlist Rust=^\s*--> (.+):(\d+):(\d+)


# ============================================================
# 14. Encoding
# ============================================================

# UTF-8 source and output.
code.page=65001
output.code.page=65001


# ============================================================
# End of rust.properties
# ============================================================
