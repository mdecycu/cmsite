# 開啟檔案時，預設顯示所有檔案
open.filter=All Files (*.*)|*.*|

# ============================================================
# External File Changes：外部檔案變更
# ============================================================

# 啟用檔案變更監控
# 當外部程式修改目前開啟的檔案時，
# SciTE 會偵測到檔案已變更
load.on.activate=1


# ============================================================
# SciTE general programming settings
# ============================================================

# ------------------------------------------------------------
# 1. Line numbers：顯示行號
# ------------------------------------------------------------

# 顯示左側行號
line.margin.visible=1

# 行號寬度，單位為字元
# 依需要調整，例如 4 可顯示到數千行
line.margin.width=4

# 行號字型與顏色
style.*.33=$(font.base),fore:#808080,back:#F0F0F0


# ------------------------------------------------------------
# 2. Word Wrap：自動換行
# ------------------------------------------------------------

wrap=1
wrap.mode=1
wrap.visual.flags=1


# ------------------------------------------------------------
# 3. Indentation：縮排
# ------------------------------------------------------------

# 每層縮排 4 個空格
tabsize=4
indent.size=4

# 按 Tab 時使用空格，而非 Tab 字元
use.tabs=0

# 自動維持縮排
indent.auto=1
indent.automatic=1
indent.maintain=1

# 顯示縮排指示線
view.indentation.guides=1
view.indentation.examine=3
highlight.indentation.guides=1


# ------------------------------------------------------------
# 4. Brace matching：括號配對
# ------------------------------------------------------------

braces.check=1
braces.sloppy=1

# 配對括號顏色
style.*.34=fore:#008000,bold
style.*.35=fore:#FF0000,bold


# ------------------------------------------------------------
# 5. Code folding：程式碼摺疊
# ------------------------------------------------------------

fold=1
fold.compact=1
fold.comment=1
fold.preprocessor=1


# ------------------------------------------------------------
# 6. Auto completion：自動完成
# ------------------------------------------------------------

# 自動完成目前文件中已出現的單字
autocompleteword.automatic=1

# 自動完成清單最多顯示 10 個項目
autocomplete.visible.item.count=10


# ------------------------------------------------------------
# 7. File change detection：外部檔案變更
# ------------------------------------------------------------

# 切回 SciTE 時檢查檔案是否被外部修改
load.on.activate=1


# ------------------------------------------------------------
# 8. End-of-line markers：換行符號
# ------------------------------------------------------------

# 0 = 不顯示 CR/LF
# 除錯跨平台文字檔時可暫時改為 1
view.eol=0


# ------------------------------------------------------------
# 9. Whitespace：空白字元
# ------------------------------------------------------------

# 0 = 不顯示空白字元
# 除錯縮排問題時可改為 1
view.whitespace=0


# ------------------------------------------------------------
# 10. Save behaviour：儲存
# ------------------------------------------------------------

# 儲存時移除行尾多餘空白
# 使用前請確認目前 SciTE 版本支援此設定
strip.trailing.spaces=1


# ------------------------------------------------------------
# 11. Output pane
# ------------------------------------------------------------

# 顯示編譯輸出視窗
output.wrap=1
output.horizontal.scrollbar=1


# ------------------------------------------------------------
# 12. Encoding：UTF-8
# ------------------------------------------------------------

code.page=65001
output.code.page=65001